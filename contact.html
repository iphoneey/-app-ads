<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا — ADEL ABDULLAH</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #2a2a2a;
    --text: #ffffff;
    --text2: #888888;
    --text3: #555555;
    --purple: #7c3aed;
    --purple2: #a78bfa;
    --gold: #c9a84c;
    --gold2: #e8c97a;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
  }

  /* Nav */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0; z-index: 10;
  }

  .nav-logo {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: var(--text);
    font-weight: 700; font-size: 15px;
  }

  .nav-logo svg { width: 32px; height: 35px; }

  .nav-back {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--purple2); text-decoration: none;
    font-size: 13px; font-weight: 500;
    transition: color 0.2s;
  }
  .nav-back:hover { color: white; }

  /* Hero */
  .hero {
    text-align: center;
    padding: 60px 20px 40px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -80px; left: 50%; transform: translateX(-50%);
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(124,58,237,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(124,58,237,0.1);
    border: 1px solid rgba(124,58,237,0.3);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px; color: var(--purple2);
    margin-bottom: 16px;
  }

  .hero h1 {
    font-size: 36px; font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }

  .hero p { font-size: 15px; color: var(--text2); }

  /* Form Container */
  .form-wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    position: relative;
    overflow: hidden;
  }

  .form-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--purple), #4f46e5, var(--purple));
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 13px; font-weight: 500;
    color: var(--text2);
    margin-bottom: 8px;
    letter-spacing: 0.3px;
  }

  input, textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
    direction: rtl;
  }

  input:focus, textarea:focus {
    border-color: var(--purple);
    box-shadow: 0 0 0 3px rgba(124,58,237,0.15);
  }

  input::placeholder, textarea::placeholder {
    color: var(--text3);
  }

  textarea {
    height: 140px;
    resize: none;
  }

  .submit-btn {
    width: 100%;
    background: var(--purple);
    border: none;
    border-radius: 12px;
    padding: 14px;
    color: white;
    font-size: 15px; font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .submit-btn:hover {
    background: #6d28d9;
    box-shadow: 0 0 24px rgba(124,58,237,0.4);
    transform: translateY(-1px);
  }

  .submit-btn:active { transform: translateY(0); }

  .submit-btn.loading {
    pointer-events: none; opacity: 0.7;
  }

  /* Success */
  .success-msg {
    display: none;
    text-align: center;
    padding: 32px 20px;
  }

  .success-icon {
    width: 64px; height: 64px;
    background: rgba(124,58,237,0.15);
    border: 1px solid rgba(124,58,237,0.3);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    margin: 0 auto 16px;
  }

  .success-msg h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .success-msg p { font-size: 14px; color: var(--text2); }

  /* Info cards */
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }

  .info-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 10px;
  }

  .info-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: rgba(124,58,237,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }

  .info-text { min-width: 0; }
  .info-label { font-size: 11px; color: var(--text3); margin-bottom: 2px; }
  .info-value { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Footer */
  footer {
    text-align: center; padding: 24px 20px;
    color: var(--text3); font-size: 12px;
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--text2); text-decoration: none; }
  footer a:hover { color: var(--text); }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">
    <svg viewBox="0 0 110 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#7c3aed"/>
          <stop offset="100%" style="stop-color:#4f46e5"/>
        </linearGradient>
      </defs>
      <path d="M55,4 L100,24 L100,60 Q100,96 55,114 Q10,96 10,60 L10,24 Z" fill="url(#ng)"/>
      <text x="55" y="66" font-family="Inter,-apple-system,sans-serif" font-size="22" font-weight="800" fill="white" text-anchor="middle">AA</text>
    </svg>
    ADEL ABDULLAH
  </a>
  <a class="nav-back" href="index.html">← العودة للتطبيقات</a>
</nav>

<div class="hero">
  <div class="hero-badge">✉️ تواصل معنا</div>
  <h1>نسعد بتواصلك</h1>
  <p>سنرد عليك في أقرب وقت ممكن</p>
</div>

<div class="form-wrap">

  <div class="info-grid">
    <div class="info-card">
      <div class="info-icon">📧</div>
      <div class="info-text">
        <div class="info-label">البريد الإلكتروني</div>
        <div class="info-value">iphoneey@hotmail.com</div>
      </div>
    </div>
    <div class="info-card">
      <div class="info-icon">🍎</div>
      <div class="info-text">
        <div class="info-label">المنصة</div>
        <div class="info-value">iOS App Developer</div>
      </div>
    </div>
  </div>

  <div class="form-card">
    <div id="form-content">
      <form id="contact-form" action="https://formsubmit.co/iphoneey@hotmail.com" method="POST">
        <input type="hidden" name="_subject" value="رسالة جديدة من موقع ADEL ABDULLAH">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="https://iphoneey.github.io/-app-ads/contact.html?sent=true">
        <input type="hidden" name="_template" value="table">

        <div class="form-group">
          <label>الاسم</label>
          <input type="text" name="name" placeholder="اكتب اسمك" required>
        </div>

        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" name="email" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
          <label>الرسالة</label>
          <textarea name="message" placeholder="اكتب رسالتك هنا..." required></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">
          إرسال الرسالة ✉️
        </button>
      </form>
    </div>

    <div class="success-msg" id="success-msg">
      <div class="success-icon">✅</div>
      <h3>تم إرسال رسالتك!</h3>
      <p>شكراً لتواصلك، سنرد عليك قريباً على بريدك الإلكتروني.</p>
    </div>
  </div>

</div>

<footer>
  © 2025 <a href="index.html">Adel Abdullah</a> — All rights reserved
</footer>

<script>
  // Show success if redirected back after sending
  if (window.location.search.includes('sent=true')) {
    document.getElementById('form-content').style.display = 'none';
    document.getElementById('success-msg').style.display = 'block';
  }
</script>

</body>
</html>
