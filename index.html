<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADEL ABDULLAH — iOS Developer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #2a2a2a;
    --text: #ffffff;
    --text2: #888888;
    --text3: #555555;
    --gold: #c9a84c;
    --gold2: #e8c97a;
    --purple: #7c3aed;
    --blue: #2563eb;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
    overflow-x: hidden;
  }

  /* Hero */
  .hero {
    position: relative;
    padding: 80px 20px 60px;
    text-align: center;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -100px; left: 50%; transform: translateX(-50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,58,237,0.15) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
  }

  /* Avatar */
  .avatar-wrap {
    position: relative;
    width: 110px; height: 110px;
    margin: 0 auto 24px;
  }

  .avatar-wrap svg {
    width: 110px; height: 110px;
    filter: drop-shadow(0 0 20px rgba(124,58,237,0.4));
  }

  .avatar-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid rgba(124,58,237,0.3);
    animation: pulse-ring 3s ease-in-out infinite;
  }

  @keyframes pulse-ring {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.05); opacity: 1; }
  }

  .hero-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(124,58,237,0.1);
    border: 1px solid rgba(124,58,237,0.3);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px; color: #a78bfa;
    margin-bottom: 16px;
    letter-spacing: 0.5px;
  }

  .hero-badge span { width: 6px; height: 6px; border-radius: 50%; background: #7c3aed; display: inline-block; animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .hero h1 {
    font-size: 42px; font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  .hero p {
    font-size: 16px; color: var(--text2);
    font-weight: 400; margin-bottom: 28px;
  }

  .store-btn {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 24px;
    color: var(--text);
    text-decoration: none;
    font-size: 14px; font-weight: 500;
    transition: all 0.2s;
  }
  .store-btn:hover {
    border-color: var(--purple);
    box-shadow: 0 0 20px rgba(124,58,237,0.2);
  }

  /* Stats */
  .stats-row {
    display: flex; justify-content: center;
    gap: 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .stat-item {
    flex: 1; max-width: 160px;
    padding: 20px 16px;
    text-align: center;
    border-left: 1px solid var(--border);
  }
  .stat-item:last-child { border-left: none; }

  .stat-num {
    font-size: 26px; font-weight: 700;
    background: linear-gradient(135deg, var(--gold2), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .stat-lbl { font-size: 11px; color: var(--text3); margin-top: 4px; letter-spacing: 0.5px; }

  /* Filters */
  .filters {
    display: flex; gap: 8px;
    padding: 16px 20px;
    overflow-x: auto; scrollbar-width: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .filters::-webkit-scrollbar { display: none; }

  .filter-btn {
    flex-shrink: 0;
    padding: 7px 16px; border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2); font-size: 12px;
    cursor: pointer; transition: all 0.15s;
    font-family: inherit; white-space: nowrap;
  }
  .filter-btn:hover { border-color: #555; color: var(--text); }
  .filter-btn.active {
    background: var(--purple); border-color: var(--purple);
    color: white;
    box-shadow: 0 0 12px rgba(124,58,237,0.4);
  }

  /* Section label */
  .section-lbl {
    font-size: 11px; font-weight: 600;
    color: var(--text3); letter-spacing: 1px;
    text-transform: uppercase;
    padding: 20px 20px 10px;
  }

  /* Loading */
  #loading {
    text-align: center; padding: 60px 20px;
    color: var(--text2); font-size: 14px;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 2px solid var(--border);
    border-top-color: var(--purple);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Grid */
  .apps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1px;
    background: var(--border);
    border-top: 1px solid var(--border);
  }

  .app-card {
    background: var(--surface);
    padding: 16px 20px;
    display: flex; align-items: center; gap: 14px;
    text-decoration: none; color: inherit;
    transition: background 0.15s;
  }
  .app-card:hover { background: var(--surface2); }
  .app-card.hidden { display: none; }

  .app-icon {
    width: 58px; height: 58px; border-radius: 14px;
    flex-shrink: 0; object-fit: cover;
    background: var(--surface2);
    border: 1px solid var(--border);
  }
  .app-icon-placeholder {
    width: 58px; height: 58px; border-radius: 14px;
    flex-shrink: 0; background: var(--surface2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }

  .app-info { flex: 1; min-width: 0; }
  .app-name {
    font-size: 14px; font-weight: 600; color: var(--text);
    margin-bottom: 3px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .app-genre { font-size: 12px; color: var(--text2); margin-bottom: 6px; }

  .app-badge {
    font-size: 10px; padding: 2px 8px;
    border-radius: 6px; font-weight: 500;
    letter-spacing: 0.3px;
  }
  .badge-game   { background: rgba(37,99,235,0.15);  color: #60a5fa; border: 1px solid rgba(37,99,235,0.3); }
  .badge-race   { background: rgba(234,179,8,0.12);  color: #fbbf24; border: 1px solid rgba(234,179,8,0.3); }
  .badge-biz    { background: rgba(16,185,129,0.12); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
  .badge-photo  { background: rgba(168,85,247,0.12); color: #c084fc; border: 1px solid rgba(168,85,247,0.3); }
  .badge-ent    { background: rgba(236,72,153,0.12); color: #f472b6; border: 1px solid rgba(236,72,153,0.3); }
  .badge-social { background: rgba(249,115,22,0.12); color: #fb923c; border: 1px solid rgba(249,115,22,0.3); }
  .badge-action { background: rgba(239,68,68,0.12);  color: #f87171; border: 1px solid rgba(239,68,68,0.3); }

  .arrow { color: var(--text3); font-size: 18px; flex-shrink: 0; }

  .no-results {
    text-align: center; padding: 40px;
    color: var(--text3); font-size: 14px; display: none;
  }

  /* Footer */
  footer {
    text-align: center; padding: 32px 20px;
    color: var(--text3); font-size: 12px;
    border-top: 1px solid var(--border);
    letter-spacing: 0.3px;
  }
  footer a { color: var(--text2); text-decoration: none; }
  footer a:hover { color: var(--text); }
</style>
</head>
<body>

<div class="hero">
  <div class="avatar-wrap">
    <div class="avatar-ring"></div>
    <svg viewBox="0 0 110 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#7c3aed"/>
          <stop offset="100%" style="stop-color:#4f46e5"/>
        </linearGradient>
        <linearGradient id="sg2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#a78bfa"/>
          <stop offset="100%" style="stop-color:#7c3aed"/>
        </linearGradient>
      </defs>
      <path d="M55,4 L100,24 L100,60 Q100,96 55,114 Q10,96 10,60 L10,24 Z" fill="url(#sg)"/>
      <path d="M55,14 L90,30 L90,60 Q90,88 55,103 Q20,88 20,60 L20,30 Z" fill="none" stroke="url(#sg2)" stroke-width="1.5" opacity="0.6"/>
      <text x="55" y="66" font-family="Inter,-apple-system,sans-serif" font-size="22" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-0.5">AA</text>
    </svg>
  </div>

  <div class="hero-badge"><span></span> iOS Developer</div>
  <h1>ADEL ABDULLAH</h1>
  <p>27 تطبيق على App Store</p>
  <a class="store-btn" href="https://apps.apple.com/sa/developer/adel-abdullah/id390109349?l=ar" target="_blank">
    عرض على App Store
  </a>
  <a class="store-btn" href="contact.html" style="margin-right:10px">
    ✉️ تواصل معنا
  </a>
  <a class="store-btn" href="support.html" style="margin-right:10px">
    🛟 الدعم
  </a>
  <a class="store-btn" href="privacy.html" style="margin-right:10px">
    🔒 سياسة الخصوصية
  </a>
</div>

<div class="stats-row">
  <div class="stat-item"><div class="stat-num" id="app-count">27</div><div class="stat-lbl">تطبيق</div></div>
  <div class="stat-item"><div class="stat-num">iOS</div><div class="stat-lbl">المنصة</div></div>
  <div class="stat-item"><div class="stat-num" id="genre-count">—</div><div class="stat-lbl">فئة</div></div>
</div>

<div class="filters">
  <button class="filter-btn active" data-filter="all">الكل</button>
  <button class="filter-btn" data-filter="game">ألعاب</button>
  <button class="filter-btn" data-filter="race">سباق</button>
  <button class="filter-btn" data-filter="biz">أعمال</button>
  <button class="filter-btn" data-filter="photo">صور وفيديو</button>
  <button class="filter-btn" data-filter="ent">ترفيه</button>
  <button class="filter-btn" data-filter="social">اجتماعي</button>
  <button class="filter-btn" data-filter="action">أكشن</button>
</div>

<div class="section-lbl" id="section-label">جميع التطبيقات</div>
<div id="loading"><div class="spinner"></div>جاري تحميل التطبيقات...</div>
<div class="apps-grid" id="apps-grid" style="display:none;"></div>
<div class="no-results" id="no-results">لا توجد تطبيقات في هذه الفئة</div>

<footer>
  © 2025 <a href="https://apps.apple.com/sa/developer/adel-abdullah/id390109349?l=ar" target="_blank">Adel Abdullah</a> — All rights reserved
</footer>

<script>
const APP_IDS = [
  6480164729, 6479958519, 6449367336, 6448471436, 6447768971,
  1631220527, 1563843404, 1564197482, 1563854415, 1563974066,
  1549863629, 1037841527, 706747887,  562717546,  1068151452,
  1080252459, 570698587,  1144096773, 1038231116, 1511456692,
  1057661830, 737478400,  710386865,  1036032553, 938955998,
  1038235731, 942678413
];

function classify(genre) {
  if (!genre) return { key: 'game', badge: 'badge-game', label: 'تطبيق' };
  const g = genre.toLowerCase();
  if (g.includes('racing'))                                          return { key: 'race',   badge: 'badge-race',   label: 'سباق' };
  if (g.includes('game') || g.includes('simulation') || g.includes('casual')) return { key: 'game', badge: 'badge-game', label: 'ألعاب' };
  if (g.includes('action'))                                          return { key: 'action', badge: 'badge-action', label: 'أكشن' };
  if (g.includes('photo') || g.includes('video'))                    return { key: 'photo',  badge: 'badge-photo',  label: 'صور وفيديو' };
  if (g.includes('social'))                                          return { key: 'social', badge: 'badge-social', label: 'اجتماعي' };
  if (g.includes('entertainment'))                                   return { key: 'ent',    badge: 'badge-ent',    label: 'ترفيه' };
  if (g.includes('business') || g.includes('productivity') || g.includes('utilities') || g.includes('lifestyle'))
                                                                     return { key: 'biz',    badge: 'badge-biz',    label: 'أعمال' };
  return { key: 'biz', badge: 'badge-biz', label: genre };
}

function renderApps(data) {
  const grid    = document.getElementById('apps-grid');
  const loading = document.getElementById('loading');
  try {
    const apps = data.results.filter(r => r.wrapperType === 'software');
    const genres = new Set();
    document.getElementById('app-count').textContent = apps.length;

    apps.forEach(app => {
      const icon  = app.artworkUrl100 || '';
      const name  = app.trackName || 'تطبيق';
      const genre = app.primaryGenreName || '';
      const link  = app.trackViewUrl || '#';
      const cls   = classify(genre);
      genres.add(cls.key);

      const card = document.createElement('a');
      card.className = 'app-card';
      card.href = link;
      card.target = '_blank';
      card.dataset.filter = cls.key;
      card.innerHTML = `
        ${icon
          ? `<img class="app-icon" src="${icon}" alt="${name}" onerror="this.outerHTML='<div class=\\'app-icon-placeholder\\'>📱</div>'">`
          : `<div class="app-icon-placeholder">📱</div>`}
        <div class="app-info">
          <div class="app-name">${name}</div>
          <div class="app-genre">${genre}</div>
          <span class="app-badge ${cls.badge}">${cls.label}</span>
        </div>
        <span class="arrow">›</span>
      `;
      grid.appendChild(card);
    });

    document.getElementById('genre-count').textContent = genres.size;
    loading.style.display = 'none';
    grid.style.display = 'grid';
    setupFilters();
  } catch(e) {
    loading.innerHTML = '<p style="color:#f87171;padding:40px">تعذّر تحميل التطبيقات.</p>';
  }
}

function setupFilters() {
  const btns  = document.querySelectorAll('.filter-btn');
  const cards = document.querySelectorAll('.app-card');
  const label = document.getElementById('section-label');
  const none  = document.getElementById('no-results');
  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      btns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const f = btn.dataset.filter;
      let count = 0;
      cards.forEach(c => {
        const show = f === 'all' || c.dataset.filter === f;
        c.classList.toggle('hidden', !show);
        if (show) count++;
      });
      label.textContent = f === 'all' ? 'جميع التطبيقات' : btn.textContent;
      none.style.display = count === 0 ? 'block' : 'none';
    });
  });
}

function loadApps() {
  const script = document.createElement('script');
  script.src = 'https://itunes.apple.com/lookup?id=' + APP_IDS.join(',') + '&country=sa&callback=renderApps';
  script.onerror = () => {
    document.getElementById('loading').innerHTML = '<p style="color:#f87171;padding:40px">تعذّر تحميل التطبيقات.</p>';
  };
  document.body.appendChild(script);
}

loadApps();
</script>
</body>
</html>
